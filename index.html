<!doctype html>
<html lang="it" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Measure Master — Pratelli Rappresentanze</title>

    <meta name="description" content="Portale misurazioni e preventivi Pratelli Rappresentanze" />
    <meta name="author" content="Pratelli Rappresentanze" />

    <!-- PWA manifest is injected by vite-plugin-pwa -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Theme color (browser chrome on Android) -->
    <meta name="theme-color" content="#F77114" />
    <meta name="msapplication-TileColor" content="#0A1017" />

    <!-- iOS PWA ("Add to Home Screen") -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Measure Master" />

    <!-- Mobile: prevent double-tap zoom, keep text size -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph -->
    <meta property="og:title" content="Measure Master — Pratelli Rappresentanze" />
    <meta property="og:description" content="Portale misurazioni e preventivi Pratelli Rappresentanze" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="Pratelli Rappresentanze" />
    <meta name="twitter:image" content="/favicon.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Splash video all'apertura (mentre l'app carica dietro) -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 99999;
        background: #0A1017; display: flex; align-items: center; justify-content: center;
        transition: opacity .5s ease; opacity: 1;
      }
      #splash video { width: 100%; height: 100%; object-fit: contain; }
      #splash .skip {
        position: absolute; bottom: calc(env(safe-area-inset-bottom) + 20px); right: 22px;
        color: rgba(255,255,255,.6); font: 500 12px/1 -apple-system, system-ui, sans-serif;
        letter-spacing: .02em; pointer-events: none;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
    </style>
  </head>

  <body>
    <div id="splash">
      <video id="splash-video" autoplay muted playsinline preload="auto"></video>
      <span class="skip">tocca per saltare</span>
    </div>
    <script>
      (function () {
        var splash = document.getElementById('splash');
        var vid = document.getElementById('splash-video');
        if (!splash || !vid) return;

        // Versione dedicata: verticale sul telefono, orizzontale su iPad/desktop.
        var isPhone = window.matchMedia('(max-width: 640px)').matches;
        vid.setAttribute('poster', isPhone ? '/intro-mobile-poster.jpg' : '/intro-poster.jpg');
        vid.style.objectFit = isPhone ? 'cover' : 'contain';
        vid.src = isPhone ? '/intro-mobile.mp4' : '/intro.mp4';

        var timer;
        function hide() {
          clearTimeout(timer);
          splash.classList.add('hide');
          if (vid) vid.pause();
        }
        function show() {
          splash.classList.remove('hide');
          if (vid) { try { vid.currentTime = 0; } catch (e) {} var p = vid.play && vid.play(); if (p && p.catch) p.catch(function () {}); }
          clearTimeout(timer); timer = setTimeout(hide, 6500);
        }

        vid.addEventListener('ended', hide);
        splash.addEventListener('click', hide); // tocca per saltare
        show(); // all'apertura

        // Ricompare ad ogni ritorno in primo piano dopo una pausa (>90s): così
        // parte anche riaprendo l'app installata, che resta viva in background.
        var hiddenAt = 0;
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) { hiddenAt = Date.now(); }
          else if (hiddenAt && Date.now() - hiddenAt > 90000) { show(); }
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
